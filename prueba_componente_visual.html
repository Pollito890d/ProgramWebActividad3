<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToastJS - Componente Visual Reutilizable</title>
    <!-- Hoja de estilos del componente -->
    <link rel="stylesheet" href="./css/componente_visual_estilos.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

    <div class="container">
        <h1>ToastJS Demo</h1>
        <p>Librería reutilizable de notificaciones flotantes con soporte de imágenes y barra temporal.</p>
        <!-- Sección 1: Con imágenes personalizadas -->
        <div class="section-title">Notificaciones con Imágenes (Carpeta /img)</div>
        <div class="btn-grid">
            <button class="demo-btn btn-info" id="btnAvatar">
                Mensaje de Usuario
            </button>
            <button class="demo-btn btn-success" id="btnPedido">
                Producto Enviado
            </button>
        </div>
        <!-- Sección 2: Sin imágenes (Iconos nativos) -->
        <div class="section-title">Notificaciones Estándar (Sin Imagen)</div>
        <div class="btn-grid">
            <button class="demo-btn btn-warning" id="btnAlerta">
                Advertencia
            </button>
            <button class="demo-btn btn-error" id="btnError">
                Error Crítico
            </button>
        </div>
    </div>

    <!-- Script del componente -->
    <script src="./js/componente_visual.js"></script>

    <!-- Prueba -->
    <script src="./js/prueba.js"> </script>
</body>
</html>
